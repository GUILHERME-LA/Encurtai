name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: o CI só precisa ler o código. Sem este bloco, o workflow
# herda o token amplo configurado no repositório.
permissions:
  contents: read

# Push novo na mesma ref cancela o run anterior em vez de empilhar fila.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Formatação: contrato é o .editorconfig da raiz.
  # ---------------------------------------------------------------------------
  formato:
    name: Formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - run: dotnet restore

      - name: Verificar formatação
        run: dotnet format --verify-no-changes --no-restore

  # ---------------------------------------------------------------------------
  # Testes unitários: SEM banco.
  #
  # Antes, unitários e integração rodavam juntos e os unitários dependiam de um
  # MongoDB no ar sem precisar. O trait Category=Integration já existia no código
  # e nunca era usado como filtro — agora é.
  # ---------------------------------------------------------------------------
  unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      - name: Rodar testes unitários com cobertura
        run: |
          dotnet test \
            --configuration Release \
            --no-build \
            --filter "Category!=Integration" \
            --logger "trx;LogFileName=unitarios.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-unitarios
          path: ./TestResults
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Testes de integração: COM banco efêmero.
  # ---------------------------------------------------------------------------
  integracao:
    name: Testes de integração
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Mongo efêmero sem autenticação, acessível só pelo runner. Não é segredo.
      MONGO_TEST_CONNECTION: "mongodb://localhost:27017"
      ConnectionStrings__Mongo: "mongodb://localhost:27017"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      - name: Rodar testes de integração
        run: |
          dotnet test \
            --configuration Release \
            --no-build \
            --filter "Category=Integration" \
            --logger "trx;LogFileName=integracao.trx" \
            --results-directory ./TestResults

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-integracao
          path: ./TestResults
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Varredura de segredo.
  #
  # O histórico está limpo hoje; este job existe para que continue limpo — e
  # serve de evidência verde do item de gestão de segredos.
  # ---------------------------------------------------------------------------
  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: segredo apagado num commit posterior continua
          # recuperável e precisa ser detectado.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Valida que as imagens compilam em TODO PR, antes de qualquer publicação.
  # Sem push: descobrir que o Dockerfile quebrou só no merge é tarde.
  # ---------------------------------------------------------------------------
  imagens:
    name: Build das imagens
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: api
            dockerfile: Dockerfile.api
          - nome: web
            dockerfile: Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compilar ${{ matrix.nome }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          build-args: |
            APP_VERSION=0.0.0-ci
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}
